name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/.cache/ms-playwright
          key: quality-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}
      - name: Locked tools and browser
        run: |
          python -m pip install uv==0.9.5
          uv sync --frozen
          uv run --frozen playwright install --with-deps chromium
      - name: Tests, coverage and reproducible distribution
        run: bash scripts/check.sh
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file artifacts/runtime-requirements.txt
          uvx --python 3.12 --from pip-audit==2.10.0 pip-audit --strict --require-hashes -r artifacts/runtime-requirements.txt -r build-requirements.txt --format json --output artifacts/dependency-audit.json
      - name: Preserve verification and tested wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-package
          path: artifacts/
      - name: Publish verified release and measured badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish.sh
